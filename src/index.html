<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>album</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page">

    <header>
      <div class="logo">album</div>
      <div class="header-right">
        <span class="meta" id="header-meta">—</span>
      </div>
    </header>

    <div class="category-tabs" id="category-tabs" hidden>
      <!-- カテゴリボタンは gallery.js が動的生成 -->
    </div>

    <div class="filters" id="filters">
      <span class="filter-label">filter</span>
      <button class="tag active" data-tag="all">all</button>
      <!-- tags injected by gallery.js -->
    </div>

    <div class="status-bar">
      <div class="status">
        <span class="dot"></span>
        <b id="count">—</b> photos
      </div>
      <div class="status dim">click to open · ← → to navigate · esc to close</div>
    </div>

  <div class="picker" id="picker" hidden>
    <div class="picker-inner">
      <div class="picker-label">photos folder</div>
      <p class="picker-hint">写真フォルダを選択してください。<br>
        フォルダをドロップ、または下のボタンから。</p>
      <button class="picker-btn" id="picker-btn">[ select folder ]</button>
    </div>
  </div>

    <div class="grid" id="grid">
      <div class="loading">loading photos.json ...</div>
    </div>

  </div>

  <!-- lightbox -->
  <div class="lb-overlay" id="lb" role="dialog" aria-modal="true" aria-label="photo viewer">
    <div class="lb-box">
      <div class="lb-content">
        <div class="lb-img-wrap" id="lb-img-wrap">
          <img id="lb-img" src="" alt="" draggable="false">
        </div>
        <div class="lb-body">
          <div class="lb-species" id="lb-species" hidden>
            <div class="lb-species-header">
              <div class="lb-species-name-ja" id="lb-species-name-ja"></div>
              <div class="lb-species-name-en" id="lb-species-name-en"></div>
            </div>
            <div class="lb-species-meta" id="lb-species-meta"></div>
            <ul class="lb-species-features" id="lb-species-features"></ul>
            <div class="lb-species-description" id="lb-species-description"></div>
          </div>
          <div class="lb-photo-info">
            <div class="lb-title" id="lb-title" hidden></div>
            <div class="lb-tags" id="lb-tags" hidden></div>
            <div class="lb-exif" id="lb-exif"></div>
          </div>
        </div>
      </div>
      <div class="lb-nav">
        <button class="lb-edit-btn" id="lb-edit" aria-label="edit species">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
        </button>
        <span class="lb-close" id="lb-close" tabindex="0">[ close ]</span>
        <div class="lb-arrows">
          <button id="lb-prev" aria-label="previous photo">← prev</button>
          <button id="lb-next" aria-label="next photo">next →</button>
        </div>
      </div>

      <!-- species 編集パネル（鉛筆アイコンで開閉） -->
      <aside class="lb-edit-panel" id="lb-edit-panel" hidden aria-label="species editor">
        <form class="lb-edit-form" id="lb-edit-form" autocomplete="off">
          <div class="lb-edit-header">
            <span class="lb-edit-title">edit species</span>
            <button type="button" class="lb-edit-close" id="lb-edit-close" aria-label="close editor">×</button>
          </div>
          <div class="lb-edit-fields">
            <label>species ID
              <input type="text" name="species_id" required spellcheck="false" autocapitalize="off">
            </label>
            <label>name (ja)
              <input type="text" name="name_ja">
            </label>
            <label>name (en)
              <input type="text" name="name_en">
            </label>
            <label>author
              <input type="text" name="author">
            </label>
            <label>year
              <input type="text" name="year">
            </label>
            <label>habitat
              <input type="text" name="habitat">
            </label>
            <label>size
              <input type="text" name="size">
            </label>
            <label>features
              <textarea name="features" rows="4" placeholder="1 行 1 項目"></textarea>
            </label>
            <label>description
              <textarea name="description" rows="6"></textarea>
            </label>
          </div>
          <div class="lb-edit-status" id="lb-edit-status" aria-live="polite"></div>
          <div class="lb-edit-actions">
            <button type="button" id="lb-edit-cancel">cancel</button>
            <button type="submit" id="lb-edit-save">save</button>
          </div>
        </form>
      </aside>
    </div>
  </div>

  <script type="module" src="gallery.js"></script>
</body>

</html>
